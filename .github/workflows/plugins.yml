name: Build AIIA Plugins

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Generate plugin sources
        run: python3 tools/generate_sources.py
      - name: Build .aiip and .dex artifacts
        run: python3 tools/build_artifacts.py
      - name: Validate store
        run: python3 scripts/validate_store.py
      - name: Verify generated files are committed
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if ! git diff --quiet -- src releases catalog; then
            echo "::error::Generated sources, releases, or catalog are out of date. Run python3 tools/generate_sources.py && python3 tools/build_artifacts.py and commit the result."
            git diff --stat -- src releases catalog
            exit 1
          fi
      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aiia-plugin-artifacts
          path: |
            releases/aiip/*.aiip
            releases/dex/*.dex
            releases/dex/*.manifest.json
            catalog/*.json
          if-no-files-found: error

  publish:
    name: Regenerate main branch artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Generate and build
        run: |
          python3 tools/generate_sources.py
          python3 tools/build_artifacts.py
          python3 scripts/validate_store.py
      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src releases catalog
          if git diff --cached --quiet; then
            echo 'Generated files already up to date.'
            exit 0
          fi
          git commit -m 'chore: regenerate plugin artifacts'
          git push
